<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChosenOnes.faith - AI Video Search</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --primary: #a80aa8;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f0f, #1a0033);
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            padding: 20px 15px;
            background: rgba(0,0,0,0.6);
            border-bottom: 2px solid var(--primary);
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            color: white;
        }
        .header p {
            margin: 8px 0 0;
            color: #ddd;
            font-size: 15px;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message {
            max-width: 90%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
        }
        .user-message {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            align-self: flex-start;
            background: #252538;
            border-bottom-left-radius: 4px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .video-card {
            background: #1e1e2e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(168, 10, 168, 0.2);
            transition: transform 0.3s;
        }
        .video-card:hover {
            transform: translateY(-5px);
        }
        .video-wrapper {
            position: relative;
            padding-top: 177.78%; /* 9:16 portrait ratio */
            background: #000;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .score {
            padding: 10px 16px;
            background: rgba(168, 10, 168, 0.15);
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            text-align: center;
        }
        .transcript {
            padding: 14px;
            font-size: 14px;
            color: #ccc;
            line-height: 1.4;
        }
        .input-area {
            padding: 20px 15px;
            background: rgba(0,0,0,0.7);
            border-top: 1px solid #444;
        }
        .input-wrapper {
            display: flex;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }
        input {
            flex: 1;
            padding: 16px 20px;
            font-size: 17px;
            border: none;
            border-radius: 30px;
            background: #2a2a3a;
            color: white;
        }
        button {
            padding: 0 32px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #c008c0;
        }
        .empty-state {
            text-align: center;
            color: #aaa;
            margin-top: 80px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ChosenOnes.faith</h1>
        <p>AI Semantic Video Search • Motivational & Faith-Based Wisdom</p>
    </div>

    <div class="chat-container" id="chat">
        <div class="empty-state">
            👋 Ask anything about success, money, mindset, faith, or motivation
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="query" placeholder="Type your question... (e.g. success mindset, making money, discipline)">
            <button onclick="sendMessage()">Search</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('query');

        async function sendMessage() {
            const query = input.value.trim();
            if (!query) return;

            chat.innerHTML += `<div class="message user-message">${query}</div>`;
            chat.scrollTop = chat.scrollHeight;

            input.value = "";

            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `<div class="message bot-message" id="${loadingId}">Searching the best videos...</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                document.getElementById(loadingId).remove();

                if (!data.results || data.results.length === 0) {
                    chat.innerHTML += `<div class="message bot-message">Sorry, no strong matches found.</div>`;
                } else {
                    let html = `<div class="message bot-message">Here are the top matching videos:</div>`;
                    html += `<div class="video-grid">`;
                    
                    data.results.forEach(item => {
                        html += `
                            <div class="video-card">
                                <div class="score">Match: ${item.score.toFixed(3)}</div>
                                <div class="video-wrapper">
                                    <video controls muted loop>
                                        <source src="${item.video_url}" type="video/mp4">
                                    </video>
                                </div>
                                <div class="transcript">${item.transcript}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    chat.innerHTML += html;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="message bot-message" style="color:#ff6666;">Connection error. Please try again.</div>`;
            }

            chat.scrollTop = chat.scrollHeight;
        }

        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
